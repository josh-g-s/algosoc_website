name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [sanity-publish]

permissions:
  contents: read

# One deploy at a time: back-to-back merges queue instead of racing the S3 sync.
# GitHub keeps only the newest pending run, which builds the newest commit.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    # A manual dispatch from another branch must not deploy it to the live site.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22.23.4"
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ secrets.SANITY_DATASET }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2

      - name: Sync hashed assets (long cache)
        run: |
          aws s3 sync dist/ s3://algosoc-website/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" \
            --exclude "sitemap*.xml" \
            --exclude "robots.txt" \
            --exclude "manifest.webmanifest" \
            --exclude "favicon.svg"

      - name: Sync HTML and crawler files (no cache)
        run: |
          aws s3 sync dist/ s3://algosoc-website/ \
            --cache-control "public, max-age=0, must-revalidate" \
            --exclude "*" \
            --include "*.html" \
            --include "sitemap*.xml" \
            --include "robots.txt" \
            --include "manifest.webmanifest" \
            --include "favicon.svg"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E33QZJV3IBVAJ8 \
            --paths "/*"
